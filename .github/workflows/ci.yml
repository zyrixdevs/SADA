name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, chore/open-source-foundation-ci]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation-quality:
    name: Documentation quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Lint Markdown and formatting
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0; markdownlint-cli2 v0.24.0
        with:
          globs: "**/*.md"
          config: .markdownlint-cli2.jsonc

  workflow-validation:
    name: Workflow and YAML validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Go for pinned workflow validator
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: 1.27.4
          cache: false
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate GitHub Actions workflows
        run: "$(go env GOPATH)/bin/actionlint -color"
      - name: Install pre-commit for YAML validation
        run: python3 -m pip install --disable-pip-version-check pre-commit==4.3.0
      - name: Validate pre-commit configuration
        run: pre-commit validate-config
      - name: Validate YAML files
        run: pre-commit run check-yaml --all-files --show-diff-on-failure

  repository-integrity:
    name: Repository integrity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate catalogue, file hygiene, and local links
        run: python3 scripts/validate_repository.py
